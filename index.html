<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta charset="UTF-8">
        <title>AR Vizitka - Katedra Informatiky</title>


        <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    </head>


    <body style="margin: 0; overflow: hidden;">
        <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-plane width="0.9" height="1.3" color="#00FF00" opacity="0.1" position="0 0 0.01" material="transparent: true; side: double;"></a-plane>
                <a-ring color="#00FF00" radius-inner="0.65" radius-outer="0.68" opacity="0.5" rotation="90 0 0" scale="0.8 1.1 1"
                        animation="property: scale; from: 0.8 1.1 1; to: 0.81 1.11 1.01; dir: alternate; loop: true; dur: 800">
                </a-ring>
                
            </a-entity>

        </a-scene>

    


    </body>
</html>
