<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta charset="UTF-8">
        <title>AR Vizitka - Katedra Informatiky</title>

        <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
        <script src="https://rawgit.com/protyze/aframe-curve-component/master/dist/aframe-curve-component.min.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
                 color-space="sRGB" 
                 renderer="colorManagement: true, physicallyCorrectLights" 
                 vr-mode-ui="enabled: false" 
                 device-orientation-permission-ui="enabled: false">
        
            
            <a-assets>
                <!-- Obrázok hradla (ak ho nemáš, text postačí, ale s obrázkom je to profi) -->
                <img id="gate-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/AND_ANSI.svg/200px-AND_ANSI.svg.png">
            </a-assets>

            <!-- KAMERA: Pridaný raycaster a cursor pre klikanie na objekty s triedou 'clickable' -->
            <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

            <!-- TARGET 0: ÚVODNÁ STRANA -->
            <a-entity mindar-image-target="targetIndex: 0">
                <a-plane width="1.1" height="1.6" color="#000000" opacity="0.8" position="0 0 -0.09" material="transparent: true; side: double;"></a-plane>
                <a-entity position="0 0 0.1">
                    <a-image src="./logo-hud.png" width="0.7" height="0.7" position="0 0 0.1"></a-image>
                    <a-entity animation="property: rotation; to: 0 360 0; dir: alternate; loop: true; dur: 8000; easing: easeInOutSine">
                        <a-gltf-model src="./logokti.glb" scale="0.9 0.9 0.9" position="0 0 0"></a-gltf-model>
                    </a-entity>
                </a-entity>
                <a-text value="VITAJTE!" color="#FFFFFF" align="center" width="2" position="0 0.6 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="KATEDRA INFORMATIKY" color="#92d404" align="center" width="2" position="0 0.49 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="OTVORTA LETÁK A VNÚTRI OBJAVÍTE:" color="#FFFFFF" align="center" width="1" position="0 -0.38 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="- Taktický Hardware" color="#1e1ee6" align="center" width="1" position="0 -0.53 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="- Software a AI na bojisku" color="#11d66a" align="center" width="1" position="0 -0.49 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="- Kybernetickú Obranu AOS" color="#d64911" align="center" width="1" position="0 -0.45 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
            </a-entity>

            <!-- TARGET 1: HARDVÉROVÁ STRANA -->
            <a-entity mindar-image-target="targetIndex: 1">
                <a-plane width="1.1" height="1.6" color="#050505" opacity="0.8" position="0 0 -0.05"></a-plane>
                

                
                <!-- MENU PRE VÝBER HRADLA -->
                <a-entity position="-0.33 0.90 0.1">
                    <a-text value="VYBER HRADLO:" position="0 -0.2 0" align="center" width="1" color="#0cdff2"></a-text> 
                    <a-circle id="btnSelectAND" class="clickable" radius="0.04" color="#00CCFF" position="-0.1 -0.3 0">
                        <a-text value="AND" align="center" width="0.8" position="0 0 0.01"></a-text>
                    </a-circle>
                    <a-circle id="btnSelectOR" class="clickable" radius="0.04" color="#333" position="0 -0.3 0">
                        <a-text value="OR" align="center" width="0.8" position="0 0 0.01"></a-text>
                    </a-circle>
                    <a-circle id="btnSelectNOT" class="clickable" radius="0.04" color="#333" position="0.1 -0.3 0">
                        <a-text value="NOT" align="center" width="0.8" position="0 0 0.01"></a-text>
                    </a-circle>
                </a-entity>

                <!-- INTERAKTÍVNA LOGIKA -->
                <a-entity position="-0.3 0.4 0.1">
                    <a-image id="gateDisplay" src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/AND_ANSI.svg/200px-AND_ANSI.svg.png" width="0.2" height="0.12" position="0 0 0"></a-image>
                    
                    <!-- Vstupy -->
                    <a-sphere id="btnA" class="clickable" radius="0.03" color="#FF0000" position="-0.12 0.04 0">
                        <a-text value="A" position="0 0.06 0" align="center" width="2"></a-text>
                    </a-sphere>
                    <a-sphere id="btnB" class="clickable" radius="0.03" color="#FF0000" position="-0.12 -0.04 0">
                        <a-text value="B" position="0 -0.06 0" align="center" width="2"></a-text>
                    </a-sphere>

                    <!-- Výstup -->
                    <a-sphere id="outQ" radius="0.04" color="#222222" position="0.15 0 0">
                        <a-text id="txtQ" value="0" position="0 -0.08 0" align="center" width="2"></a-text>
                    </a-sphere>
                </a-entity>

                <!-- OSTATNÉ PRVKY (CPU a DRON) ostanú ako predtým -->
                <a-entity position="0 0 0.2">
                    <a-gltf-model id="cpu" src="./cpu-model.glb" scale="0.0015 0.0015 0.0015" animation="property: rotation; to: 0 360 360; loop: true; dur: 8000; easing: easeInOutSine"></a-gltf-model>
                </a-entity>

                <a-entity position="0.35 -0.5 0.1">
                    <a-gltf-model src="./drone.glb" scale="0.3 0.3 0.3" animation="property: position; from: 0 0 0; to: 0 0.08 0; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true"></a-gltf-model>
                </a-entity>

                
            <!-- 3. ARCHITEKTÚRY PC SYSTÉMOV (Vpravo hore) -->
                <a-entity position="0.35 0.5 0.1">

                    <a-text id="click-hint" value="KLIKNI NA DOSKU" align="center" position="-0.05 0.18 0" width="1" color="#0cdff2"></a-text>

                    <!-- Hlavná doska - jediná má triedu 'clickable' na začiatku -->
                    <a-entity id="main-board" class="clickable" gltf-model="./motherboard.glb" 
                            scale="1 1 1" rotation="90 90 0" position="0 0.05 0">
                    </a-entity>

                    

                    <!-- PANEL S KOMPONENTMI (Štartuje ako visible: false) -->
                    <a-entity id="architecture-panel" visible="false">
                        
                        <!-- Čierne pozadie panelu, aby komponenty nesplývali s letákom -->
                        <a-plane width="0.6" height="1.2" color="#111" position="0 0 0.05" opacity="1"></a-plane>
                        <a-text id="textP" value="HLAVNE KOMPONENTY \nDOSKY:" align="center" position="0 0.5 0.1" width="1" color="#0cdff2"></a-text>

                        <!-- CPU -->
                        <a-entity id="p-cpu" gltf-model="./pc_cpu_processor.glb" scale="0.06 0.06 0.06" position="0 0.3 0.1" rotation="-90 0 0"></a-entity>
                        <a-text value="PROCESOR" position="0 0.15 0.1" width="1" align="center"></a-text>

                        <!-- RAM -->
                        <a-entity id="p-ram" gltf-model="./old_computer_ram.glb" scale="0.07 0.07 0.07" position="0 0 0.1" rotation="-150 0 0"></a-entity>
                        <a-text value="PAMAT RAM" position="0 -0.1 0.12" width="1" align="center"></a-text>

                        <!-- GPU -->
                        <a-entity id="p-gpu" gltf-model="./gpu.glb" scale="0.04 0.04 0.04" position="0.05 -0.3 0.1" rotation="90 0 0"></a-entity>
                        <a-text value="GRAFIKA" position="0 -0.4 0.1" width="1" align="center"></a-text>

                        <!-- Tlačidlo na zavretie -->
                        <a-entity id="btn-close" class="clickable" 
                            geometry="primitive: plane; width: 0.25; height: 0.12" 
                            material="transparent: true; opacity: 0" 
                            position="0 -0.5 0.12">
                            
                            <!-- Viditeľné pozadie tlačidla -->
                            <a-plane width="0.25" height="0.12" color="#FFFFFF" position="0 0 0"></a-plane>
                            
                            <!-- Biely rámček -->
                            <a-rect width="0.25" height="0.9" fill="none" stroke-width="1.8" position="0 0 0.01"></a-rect>
                            
                            <!-- Text -->
                            <a-text value="Zatvoriť" align="center" width="1.3" color="#0cdff2" position="0 0 0.02" font="./Exo2-Medium-msdf.json" negate="false"></a-text>

                        </a-entity>
                    </a-entity>
                </a-entity>
            </a-entity>

            <a-entity mindar-image-target="targetIndex: 2">
                
                <a-plane width="1.1" height="1.6" color="#050505" opacity="0.95" position="0 0 -0.05"></a-plane>

                <!-- GLOBÁLNA SIEŤ (Uzly okolo Zeme) -->
                <a-entity id="cyber-globe" position="0 -0.1 0.1">
                    <a-sphere radius="0.3" src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/space/earth_atmos_2048.jpg"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 25000; easing: linear">
                    </a-sphere>

                    <a-entity class="attack-line" line="start: 0.3 0.2 0; end: 0 0 0.25; color: #00CCFF; opacity: 0.6"></a-entity>
                    <a-sphere class="attack-pulse" radius="0.015" color="#00CCFF" 
                            animation="property: position; from: 0.3 0.2 0; to: 0 0 0.25; dur: 2000; loop: true; easing: linear">
                    </a-sphere>

                    <a-entity class="attack-line" line="start: -0.3 0.1 -0.1; end: 0 0 0.25; color: #FF00CC; opacity: 0.6"></a-entity>
                    <a-sphere class="attack-pulse" radius="0.015" color="#FF00CC" 
                            animation="property: position; from: -0.3 0.1 -0.1; to: 0 0 0.25; dur: 3000; loop: true; easing: linear">
                    </a-sphere>

                    <a-entity class="attack-line" line="start: 0.1 -0.4 0; end: 0 0 0.25; color: #66FFCC; opacity: 0.6"></a-entity>
                    <a-sphere class="attack-pulse" radius="0.015" color="#66FFCC" 
                            animation="property: position; from: 0.1 -0.4 0; to: 0 0 0.25; dur: 2500; loop: true; easing: linear">
                    </a-sphere>

                    <a-sphere class="node" radius="0.02" color="#FF0000" position="0.3 0.2 0"></a-sphere>
                    <a-sphere class="node" radius="0.02" color="#FF0000" position="-0.3 0.1 -0.1"></a-sphere>
                    <a-sphere class="node" radius="0.02" color="#FF0000" position="0.1 -0.4 0"></a-sphere>
                </a-entity>

                <!-- ČERVENY ŠTÍT -->
                <a-sphere id="red-shield" radius="0.37" color="#FF0000" opacity="0.4" visible="true"
                        material="wireframe: true; wireframeLineWidth: 2" position="0 0 0.1">
                </a-sphere>

                <!-- MODRÝ ŠTÍT -->
                <a-sphere id="blue-shield" radius="0.38" color="#00CCFF" opacity="0" visible="false"
                        material="wireframe: true; wireframeLineWidth: 2" position="0 0 0.1">
                </a-sphere>

                <!-- TERMINÁLNY LOG (Vľavo hore) -->
                <a-entity position="-0.4 0.55 0.1">
                    <a-text id="log-1" value="> DETECTING ATTACKS..." color="#FF0000" width="1.5" position="0 0.1 0"></a-text>
                    <a-text id="log-2" value="> IP: 192.168.1.104" color="#FF0000" width="1.2" position="0 0.02 0"></a-text>
                    <a-text id="log-3" value="> TYPE: DDOS_SPOOF" color="#FF3333" width="1.2" position="0 -0.06 0"></a-text>
                </a-entity>

                <!-- TLAČIDLO -->
                <a-entity id="btn-firewall" class="clickable" 
                    position="0 -0.55 0.2" 
                    geometry="primitive: plane; width: 0.7; height: 0.2" 
                    material="transparent: true; opacity: 0">
                
                    <!-- To, čo používateľ reálne vidí -->
                    <a-plane width="0.7" height="0.15" color="#FF3333" id="btn-bg"></a-plane>
                    <a-text id="btn-label" value="NASADIŤ FIREWALL" align="center" width="1.5" color="white" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                
                </a-entity>

            </a-entity>
            <!-- TARGET 3: SOFTWARE A INTELIGENTNE SYSTEMY -->
<a-entity mindar-image-target="targetIndex: 3">

    <!-- Pozadie -->
    <a-plane width="1.1" height="1.6" color="#000000" opacity="0.85" position="0 0 -0.05"></a-plane>

    <!-- Nadpis -->
    <a-text value="SOFTWARE A INTELIGENTNE \nSYSTEMY"
            color="#66FFCC"
            align="center"
            width="1.5"
            position="0 0.65 0.1"
            font="./Exo2-Medium-msdf.json"
            negate="false">
    </a-text>
    <a-entity id="ai-core" position="0 0.15 0.12"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"
          animation__pulse="property: scale; from: 1 1 1; to: 1.04 1.04 1.04; dir: alternate; loop: true; dur: 1800">
    <a-gltf-model src="./cyber_brain_ai.glb" scale="0.12 0.12 0.12"></a-gltf-model>
</a-entity>

    <!-- Stredovy AI core -->
    <a-entity id="ai-core" position="0 0.15 0.12" animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
        <a-sphere radius="0.12" color="#00CCAA" opacity="0.18"></a-sphere>
        <a-circle radius="0.09" color="#00E6C3" opacity="0.9"></a-circle>
        <a-text value="AI"
                align="center"
                color="#FFFFFF"
                width="1.2"
                position="0 0 0.01"
                font="./Exo2-Medium-msdf.json"
                negate="false">
        </a-text>
    </a-entity>

    <!-- Spojnice -->
    <a-entity line="start: 0 0.15 0.1; end: -0.32 0.41 0.1; color: #33DDCC"></a-entity>
    <a-entity line="start: 0 0.15 0.1; end: 0.32 0.41 0.1; color: #66FF99"></a-entity>
    <a-entity line="start: 0 0.15 0.1; end: 0 -0.21 0.1; color: #33CCFF"></a-entity>

    <!-- Tlacidlo 1: KOD -->
    <a-entity id="btn-code" class="clickable" position="-0.32 0.41 0.12">
        <a-circle radius="0.11" class="clickable" color="#0D1B2A" opacity="0.95" stroke="#33DDCC"></a-circle>
        <a-image src="./coding.png"
             width="0.10"
             height="0.10"
             color="white"
             position="0 0 0.01">
             
        </a-image>
        <a-text value="PROGRAMOVANIE"
                align="center"
                color="#FFFFFF"
                width="0.9"
                position="0 -0.21 0.01"
                font="./Exo2-Medium-msdf.json"
                negate="false">
        </a-text>
    </a-entity>

    <!-- Tlacidlo 2: TERMINAL -->
    <a-entity id="btn-terminal" class="clickable" position="0.32 0.41 0.12">
        <a-circle radius="0.11" class="clickable" color="#0D1B2A" opacity="0.95"></a-circle>
        <a-image src="./linux.png"
             width="0.10"
             height="0.10"
             color="white"
             position="0 0 0.01">
             
        </a-image>
        <a-text value="LINUX"
                align="center"
                color="#FFFFFF"
                width="0.9"
                position="0 -0.15 0.01"
                font="./Exo2-Medium-msdf.json"
                negate="false">
        </a-text>
    </a-entity>

    <!-- Tlacidlo 3: AI analyza -->
    <a-entity id="btn-ai" class="clickable" position="0 -0.15 0.12">
        <a-circle radius="0.11" class="clickable" color="#0D1B2A" opacity="0.95"></a-circle>
        <a-image src="./dashboard.png"
             width="0.10"
             height="0.10"
             color="white"
             position="0 0 0.01">
             
        </a-image>
        <a-text value="ANALYZA"
                align="center"
                color="#FFFFFF"
                width="1"
                position="0 -0.15 0.01"
                font="./Exo2-Medium-msdf.json"
                negate="false">
        </a-text>
    </a-entity>

    <!-- Panel -->
    <a-plane id="sw-panel-bg"
             width="0.92"
             height="0.34"
             color="#0B1120"
             opacity="0.92"
             position="0 -0.58 0.1">
    </a-plane>


    <a-text id="sw-panel-title"
            value="SOFTWARE PANEL"
            align="center"
            color="#66FFCC"
            width="1"
            position="0 -0.46 0.11"
            font="./Exo2-Medium-msdf.json"
            negate="false">
    </a-text>

    <a-text id="sw-panel-text"
            value="Klikni na jednu z ikon a zobrazim ukazku kodu, terminalu alebo AI analyzy."
            align="center"
            color="#FFFFFF"
            width="0.9"
            wrap-count="34"
            position="0 -0.62 0.11"
            font="./Exo2-Medium-msdf.json"
            negate="false">
    </a-text>

</a-entity>

                
            <script>
    window.addEventListener('load', () => {
        // --- 1. SELEKTORY (Všetky premenné na jednom mieste) ---
        
        // Target 1: Maticová doska
        const board = document.querySelector('#main-board');
        const panel = document.querySelector('#architecture-panel');
        const closeBtn = document.querySelector('#btn-close');
        const hintText = document.querySelector('#click-hint');
        const HlavneCpu = document.querySelector('#cpu');

        // Target 2: Kybernetická obrana
        const btnFirewall = document.querySelector('#btn-firewall');
        const btnBg = document.querySelector('#btn-bg');
        const btnLabel = document.querySelector('#btn-label');
        const blueShield = document.querySelector('#blue-shield');
        const redShield = document.querySelector('#red-shield');
        const nodes = document.querySelectorAll('.node');
        const log1 = document.querySelector('#log-1');
        const log2 = document.querySelector('#log-2');
        const log3 = document.querySelector('#log-3');
        const attackLines = document.querySelectorAll('.attack-line');
        const attackPulses = document.querySelectorAll('.attack-pulse');

        // Target 3: Softvér a AI
        const btnCode = document.querySelector('#btn-code');
        const btnTerminal = document.querySelector('#btn-terminal');
        const btnAi = document.querySelector('#btn-ai');
        const panelTitle = document.querySelector('#sw-panel-title');
        const panelText = document.querySelector('#sw-panel-text');
        const aiCore = document.querySelector('#ai-core');

        let isFirewallActive = false;

        // --- 2. LOGIKA: TARGET 1 (Architektúra / Doska) ---
        if (board && panel && closeBtn) {
            board.addEventListener('click', () => {
                panel.setAttribute('visible', 'true');
                board.setAttribute('visible', 'false');
                if (hintText) hintText.setAttribute('visible', 'false');
                if (HlavneCpu) HlavneCpu.setAttribute('visible', 'false');
                panel.setAttribute('animation', 'property: position; from: 0 0 -0.1; to: 0 0 0.1; dur: 500; easing: easeOutExpo');
            });

            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                panel.setAttribute('animation', 'property: position; from: 0 0 0.1; to: 0 0 -0.1; dur: 500; easing: easeOutExpo');
                setTimeout(() => {
                    panel.setAttribute('visible', 'false');
                    board.setAttribute('visible', 'true');
                    if (hintText) hintText.setAttribute('visible', 'true');
                    if (HlavneCpu) HlavneCpu.setAttribute('visible', 'true');
                }, 500);
            });
        }

        // --- 3. LOGIKA: TARGET 2 (Kybernetická obrana + Útoky) ---
        if (btnFirewall) {
            btnFirewall.addEventListener('click', (e) => {
                e.stopPropagation();

                if (!isFirewallActive) {
                    // === AKTIVÁCIA FIREWALLU ===
                    if (redShield) redShield.setAttribute('visible', 'false');
                    if (blueShield) {
                        blueShield.setAttribute('visible', 'true');
                        blueShield.setAttribute('animation', 'property: material.opacity; from: 0; to: 0.4; dur: 1000');
                    }

                    // Skryť útočníkov a zastaviť impulzy
                    nodes.forEach(n => n.setAttribute('visible', 'false'));
                    attackPulses.forEach(p => p.setAttribute('visible', 'false'));
                    
                    // Stmaviť čiary útokov
                    attackLines.forEach(l => {
                        l.setAttribute('line', 'opacity: 0.1; color: #004466');
                    });

                    // Update logov
                    if (log1) { log1.setAttribute('value', '> SYSTEM SECURE'); log1.setAttribute('color', '#00CCFF'); }
                    if (log2) { log2.setAttribute('value', '> FIREWALL: ACTIVE'); log2.setAttribute('color', '#00CCFF'); }
                    if (log3) { log3.setAttribute('value', '> NO THREATS FOUND'); log3.setAttribute('color', '#00CCFF'); }

                    if (btnBg) btnBg.setAttribute('color', '#004466');
                    if (btnLabel) btnLabel.setAttribute('value', 'VYPNÚŤ FIREWALL');
                    isFirewallActive = true;
                } else {
                    // === DEAKTIVÁCIA FIREWALLU (Reset útoku) ===
                    if (blueShield) blueShield.setAttribute('visible', 'false');
                    if (redShield) redShield.setAttribute('visible', 'true');

                    // Zobraziť útočníkov a spustiť impulzy
                    nodes.forEach(n => n.setAttribute('visible', 'true'));
                    attackPulses.forEach(p => p.setAttribute('visible', 'true'));

                    // Vrátiť farbu čiaram
                    const lineColors = ['#00CCFF', '#FF00CC', '#66FFCC'];
                    attackLines.forEach((l, i) => {
                        l.setAttribute('line', `opacity: 0.6; color: ${lineColors[i] || '#00CCFF'}`);
                    });

                    // Reset logov
                    if (log1) { log1.setAttribute('value', '> DETECTING ATTACKS...'); log1.setAttribute('color', '#FF0000'); }
                    if (log2) { log2.setAttribute('value', '> IP: 192.168.1.104'); log2.setAttribute('color', '#FF0000'); }
                    if (log3) { log3.setAttribute('value', '> TYPE: DDOS_SPOOF'); log3.setAttribute('color', '#FF3333'); }

                    if (btnBg) btnBg.setAttribute('color', '#FF3333');
                    if (btnLabel) btnLabel.setAttribute('value', 'NASADIŤ FIREWALL');
                    isFirewallActive = false;
                }
            });
        }

        // --- 4. LOGIKA: TARGET 3 (Softvér a AI) ---
        const pulseAiCore = () => {
            if (aiCore) {
                aiCore.removeAttribute('animation__pulse');
                aiCore.setAttribute('animation__pulse', 'property: scale; from: 1 1 1; to: 1.08 1.08 1.08; dir: alternate; loop: 2; dur: 350');
            }
        };

        if (btnCode) {
            btnCode.addEventListener('click', () => {
                if (panelTitle) panelTitle.setAttribute('value', 'SOFTVÉROVÉ INŽINIERSTVO');
                if (panelText) panelText.setAttribute('value', 'def evaluate_signal(signal):\n    if signal > 80:\n        return "ALERT"\n    else:\n        return "OK"');
                pulseAiCore();
            });
        }

        if (btnTerminal) {
            btnTerminal.addEventListener('click', () => {
                if (panelTitle) panelTitle.setAttribute('value', 'OPERAČNÉ SYSTÉMY');
                if (panelText) panelText.setAttribute('value', '$ boot kernel\n$ start services\n$ network online\n$ system ready');
                pulseAiCore();
            });
        }

        if (btnAi) {
            btnAi.addEventListener('click', () => {
                if (panelTitle) panelTitle.setAttribute('value', 'ANALYTICKÉ SYSTÉMY (AI)');

            <script>
                let a = false;
                let b = false;
                let activeGate = 'AND'; // Predvolené hradlo

                const gateImages = {
                    AND: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/AND_ANSI.svg/200px-AND_ANSI.svg.png',
                    OR: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/OR_ANSI.svg/200px-OR_ANSI.svg.png',
                    NOT: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/NOT_ANSI.svg/200px-NOT_ANSI.svg.png'
                };

                function updateLogic() {
                    let result = false;
                    const btnB = document.querySelector('#btnB');

                    if (activeGate === 'AND') {
                        result = a && b;
                        btnB.setAttribute('visible', 'true');
                    } else if (activeGate === 'OR') {
                        result = a || b;
                        btnB.setAttribute('visible', 'true');
                    } else if (activeGate === 'NOT') {
                        result = !a; // NOT berie len vstup A
                        btnB.setAttribute('visible', 'false'); // Skryjeme nepotrebný vstup B
                    }

                    document.querySelector('#btnA').setAttribute('color', a ? '#00FF00' : '#FF0000');
                    document.querySelector('#btnB').setAttribute('color', b ? '#00FF00' : '#FF0000');
                    document.querySelector('#outQ').setAttribute('color', result ? '#00FF00' : '#222222');
                    document.querySelector('#txtQ').setAttribute('value', result ? '1' : '0');
                }

                // Prepínanie typu hradla
                ['AND', 'OR', 'NOT'].forEach(gate => {
                    document.querySelector('#btnSelect' + gate).addEventListener('click', () => {
                        activeGate = gate;
                        document.querySelector('#gateDisplay').setAttribute('src', gateImages[gate]);
                        
                        // Reset farieb tlačidiel menu
                        ['AND', 'OR', 'NOT'].forEach(g => document.querySelector('#btnSelect' + g).setAttribute('color', '#333'));
                        document.querySelector('#btnSelect' + gate).setAttribute('color', '#00CCFF');
                        
                        updateLogic();
                    });
                });

                document.querySelector('#btnA').addEventListener('click', () => { a = !a; updateLogic(); });
                document.querySelector('#btnB').addEventListener('click', () => { b = !b; updateLogic(); });
            </script>
    </body>
</html>
