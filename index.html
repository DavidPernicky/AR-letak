<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta charset="UTF-8">
        <title>AR Vizitka - Katedra Informatiky</title>


        <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    </head>


    <body style="margin: 0; overflow: hidden;">
        <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
            <!-- uvodna strana letáku -->
            <a-entity mindar-image-target="targetIndex: 0">
                <a-plane width="1.1" height="1.6" color="#000000" opacity="0.8" position="0 0 -0.09" material="transparent: true; side: double;"></a-plane>
                <a-entity position="0 0 0.1">
                    <a-image src="./logo-hud.png" width="0.7" height="0.7" position="0 0 0.1"></a-image>
                    <a-entity animation="property: rotation; to: 0 360 0; dir: alternate; loop: true; dur: 8000; easing: easeInOutSine">
                        <a-gltf-model src="./logokti.glb" 
                        scale="0.9 0.9 0.9" 
                        position="0 0 0">
                        </a-gltf-model>
                    </a-entity>
                </a-entity>
                <a-text value="VITAJTE!" color="#FFFFFF" align="center" width="2" position="0 0.6 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="KATEDRA INFORMATIKY" color="#92d404" align="center" width="2" position="0 0.49 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="OTVORTE LETÁK A VNÚTRI OBJAVÍTE:" color="#FFFFFF" align="center" width="1" position="0 -0.38 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="-Taktický Hardware" color="#1e1ee6" align="center" width="1" position="0 -0.53 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="-Software a AI na bojisku" color="#11d66a" align="center" width="1" position="0 -0.49 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="-Kybernetickú Obranu AOS" color="#d64911" align="center" width="1" position="0 -0.45 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>


            </a-entity>

        <!-- druha strana letaku-hardware -->
            <a-entity mindar-image-target="targetIndex:1">
                <a-plane width="1.1" height="1.6" color="#050505" opacity="0.8" position="0 0 -0.05"></a-plane>
                <a-text value="AKTIVNY HARDVEROVY STACK AOS" color="#00CCFF" align="center" width="2" position="0 0.8 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-entity position="0 0 0.2">
                    <a-gltf-model src="./cpu-model.glb" scale="0.002 0.002 0.002"
                      animation="property: rotation; from: 0 0 0; to: 0 360 360; dir: alternate; loop: true; dur: 8000; easing: easeInOutSine">
                    </a-gltf-model>
                </a-entity>
                <a-entity position="0 0 0.1">
                    <a-sphere radius="0.01" color="#00FF00" 
                        animation="property: position; from: 0 0 0; to: 0.38 -0.5 0; loop: true; dur: 1500; easing: linear">
                    </a-sphere>
                </a-entity>

                <a-entity position="0.38 0.5 0.1">
                    <a-box scale="0.1 0.1 0.01" color="#333" material="wireframe: true">
                        <a-text value="PC ARCH" align="center" width="1"></a-text>
                    </a-box>
                </a-entity>

                <a-entity position="-0.38 0.5 0.1">
                    <a-plane width="0.2" height="0.1" color="#FF0000" opacity="0.2" material="wireframe: true">
                        <a-text value="LOGIC" align="center" width="1"></a-text>
                    </a-plane>
                </a-entity>

                <a-entity position="-0.38 -0.5 0.1">
                    <a-sphere radius="0.05" color="#00CCFF" material="wireframe: true">
                        <a-text value="SYSTEMS" align="center" width="1"></a-text>
                    </a-sphere>
                </a-entity>

                <a-entity position="0.38 -0.5 0.1">
                    <a-gltf-model src="./gltf/tactical_drone.glb" scale="0.1 0.1 0.1">
                    </a-gltf-model>
                    <a-text value="ACTIVE SCAN:\nPING: 15ms" color="#00FF00" width="1" position="0 -0.12 0" font="monoid" align="center"></a-text>
                </a-entity>

            </a-entity>






        </a-scene>


    


    </body>
</html>
