<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta charset="UTF-8">
        <title>AR Vizitka - Katedra Informatiky</title>


        <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    </head>


    <body style="margin: 0; overflow: hidden;">
        <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-plane width="1.1" height="1.6" color="#000000" opacity="0.8" position="0 0 -0.09" material="transparent: true; side: double;"></a-plane>
                <a-entity position="0 0.2 0.1">
                    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
                        <a-gltf-model src="./logokti.glb" 
                        scale="1.2 1.2 1.2" 
                        position="0 0 0">
                        </a-gltf-model>
                    </a-entity>
                </a-entity>
                <a-text value="(Pre všeobecne informacie o katedre kliknite na logo)" color="#FFFFFF" align="center" width="0.5" position="0 0.2 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="VITAJTE!" color="#FFFFFF" align="center" width="2" position="0 0.5 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                
                <a-text value="OTVORTE LETÁK A VNÚTRI OBJAVÍTE:\n\n- Taktický Hardware IoBT\n- Software a AI na bojisku\n- Kybernetickú Obranu AOS" 
                color="#FFFFFF" align="center" width="1.2" position="0 -0.4 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
    


                

            </a-entity>

        </a-scene>

    


    </body>
</html>
