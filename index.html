<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta charset="UTF-8">
        <title>AR Vizitka - Katedra Informatiky</title>


        <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    </head>


    <body style="margin: 0; overflow: hidden;">
        <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-plane width="1.1" height="1.6" color="#000000" opacity="0.8" position="0 0 -0.09" material="transparent: true; side: double;"></a-plane>
                <a-entity position="0 0 0.1">
                    <a-image src="./logo-hud.png" position="0 0 0" width="0.8" height="0.8" position="0 0 0.1"></a-image>
                    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
                        <a-gltf-model src="./logokti.glb" 
                        scale="0.9 0.9 0.9" 
                        position="0 0 0">
                        </a-gltf-model>
                    </a-entity>
                </a-entity>
                <a-text value="VITAJTE!" color="#FFFFFF" align="center" width="2" position="0 0.6 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="KATEDRA INFORMATIKY" color="#FFFFFF" align="center" width="2" position="0 0.49 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="OTVORTE LETÁK A VNÚTRI OBJAVÍTE:" color="#FFFFFF" align="center" width="1" position="0 -0.35 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="-Taktický Hardware" color="#1e1ee6" align="center" width="1" position="0 -0.40 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="-Software a AI na bojisku" color="#11d66a" align="center" width="1" position="0 -0.44 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="-Kybernetickú Obranu AOS" color="#d64911" align="center" width="1" position="0 -0.48 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>


                

            </a-entity>

        </a-scene>

    


    </body>
</html>
