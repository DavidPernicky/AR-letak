<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta charset="UTF-8">
        <title>AR Leták - Katedra Informatiky</title>

        <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
                 color-space="sRGB" 
                 renderer="colorManagement: true, physicallyCorrectLights" 
                 vr-mode-ui="enabled: false" 
                 device-orientation-permission-ui="enabled: false">
        
            <a-assets>
                <img id="gate-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/AND_ANSI.svg/200px-AND_ANSI.svg.png">
            </a-assets>

            <!-- KAMERA -->
            <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

            <!-- ========== TARGET 0: ÚVODNÁ STRANA ========== -->
            <a-entity mindar-image-target="targetIndex: 0">
                <a-plane width="1.1" height="1.6" color="#000000" opacity="0.8" position="0 0 -0.09" material="transparent: true; side: double;"></a-plane>
                <a-entity position="0 0.1 0.1">
                    <a-image src="./logo-hud.png" width="0.7" height="0.7" position="0 0 0.1"></a-image>
                    <a-entity animation="property: rotation; to: 0 360 0; dir: alternate; loop: true; dur: 8000; easing: easeInOutSine">
                        <a-gltf-model src="./logokti.glb" scale="0.9 0.9 0.9" position="0 0 0"></a-gltf-model>
                    </a-entity>
                </a-entity>
                <a-text value="VITAJTE!" color="#FFFFFF" align="center" width="2" position="0 0.7 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="KATEDRA INFORMATIKY" color="#92d404" align="center" width="2" position="0 0.59 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="OTVORTA LETÁK A VNÚTRI OBJAVÍTE:" color="#FFFFFF" align="center" width="1" position="0 -0.38 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="- Taktický Hardware" color="#06c6d4" align="center" width="1" position="0 -0.45 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="- Software a AI na bojisku" color="#11d66a" align="center" width="1" position="0 -0.49 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="- Kybernetickú Obranu AOS" color="#d64911" align="center" width="1" position="0 -0.53 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
            </a-entity>

            <!-- ========== TARGET 1: HARDVÉROVÁ STRANA ========== -->
            <a-entity mindar-image-target="targetIndex: 1">
                <a-plane width="1.1" height="1.6" color="#050505" opacity="0.8" position="0 0 -0.05"></a-plane>

                <!-- MENU PRE VÝBER HRADLA -->
                <a-entity position="-0.33 0.90 0.1">
                    <a-text value="VYBER HRADLO:" position="0 -0.2 0" align="center" width="1" color="#0cdff2"></a-text>
                    <a-circle id="btnSelectAND" class="clickable" radius="0.04" color="#00CCFF" position="-0.1 -0.3 0">
                        <a-text value="AND" align="center" width="0.8" position="0 0 0.01"></a-text>
                    </a-circle>
                    <a-circle id="btnSelectOR" class="clickable" radius="0.04" color="#333" position="0 -0.3 0">
                        <a-text value="OR" align="center" width="0.8" position="0 0 0.01"></a-text>
                    </a-circle>
                    <a-circle id="btnSelectNOT" class="clickable" radius="0.04" color="#333" position="0.1 -0.3 0">
                        <a-text value="NOT" align="center" width="0.8" position="0 0 0.01"></a-text>
                    </a-circle>
                </a-entity>

                <!-- INTERAKTÍVNA LOGIKA HRADIEL -->
                <a-entity position="-0.3 0.4 0.1">
                    <a-circle radius="0.1" color="#FFFFFF" opacity="0.5" position="0 0 -0.01"></a-circle>
                    <a-image id="gateDisplay" src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/AND_ANSI.svg/200px-AND_ANSI.svg.png" 
                        color="#ffffff" width="0.2" height="0.12" position="0 0 0"
                        material="emissive: #FFFFFF; emissiveIntensity: 2">
                    </a-image>
                    <a-sphere id="btnA" class="clickable" radius="0.03" color="#FF0000" position="-0.12 0.04 0">
                        <a-text value="A" position="0 0.06 0" align="center" width="2"></a-text>
                    </a-sphere>
                    <a-sphere id="btnB" class="clickable" radius="0.03" color="#FF0000" position="-0.12 -0.04 0">
                        <a-text value="B" position="0 -0.06 0" align="center" width="2"></a-text>
                    </a-sphere>
                    <a-sphere id="outQ" radius="0.04" color="#c0c2c2" position="0.15 0 0">
                        <a-text id="txtQ" value="0" position="0 -0.08 0" align="center" width="2"></a-text>
                    </a-sphere>
                </a-entity>

                <!-- CPU MODEL -->
                <a-entity position="0 0 0.2">
                    <a-gltf-model id="cpu" src="./cpu-model.glb" scale="0.0015 0.0015 0.0015" animation="property: rotation; to: 0 360 360; loop: true; dur: 8000; easing: easeInOutSine"></a-gltf-model>
                </a-entity>

                <!-- DRON -->
                <a-entity position="0 -0.3 0.1">
                    <a-gltf-model src="./drone.glb" scale="0.6 0.6 0.6" animation="property: position; from: -0.2 0.05 0; to: 0.25 -0.05 0; dir: alternate; dur: 6000; easing: easeInOutSine; loop: true"></a-gltf-model>
                </a-entity>

                <!-- ARCHITEKTÚRA PC SYSTÉMOV -->
                <a-entity position="0.30 0.5 0.1">
                    <a-text id="click-hint" value="KLIKNI NA DOSKU" align="center" position="-0.05 0.18 0" width="1" color="#0cdff2" font="./Exo2-Medium-msdf.json" negate="false"></a-text>

                    <a-entity id="main-board" class="clickable" gltf-model="./motherboard.glb" 
                            scale="2 2 2" rotation="90 90 0" position="0 -0.05 0.1">
                    </a-entity>

                    <a-entity id="architecture-panel" visible="false">
                        <a-plane width="0.6" height="1.2" color="#111" position="0 0 0.05" opacity="1"></a-plane>
                        <a-text value="HLAVNE KOMPONENTY \nDOSKY:" align="center" position="0 0.5 0.1" width="1" color="#0cdff2" font="./Exo2-Medium-msdf.json" negate="false"></a-text>

                        <a-entity gltf-model="./pc_cpu_processor.glb" scale="0.06 0.06 0.06" position="0 0.3 0.1" rotation="-90 0 0"></a-entity>
                        <a-text value="PROCESOR" position="0 0.15 0.1" width="1" align="center" font="./Exo2-Medium-msdf.json" negate="false"></a-text>

                        <a-entity gltf-model="./old_computer_ram.glb" scale="0.07 0.07 0.07" position="0 0 0.1" rotation="-150 0 0"></a-entity>
                        <a-text value="PAMAT RAM" position="0 -0.1 0.12" width="1" align="center" font="./Exo2-Medium-msdf.json" negate="false"></a-text>

                        <a-entity gltf-model="./gpu.glb" scale="0.04 0.04 0.04" position="0.05 -0.3 0.1" rotation="90 0 0"></a-entity>
                        <a-text value="GRAFIKA" position="0 -0.4 0.1" width="1" align="center" font="./Exo2-Medium-msdf.json" negate="false"></a-text>

                        <a-entity id="btn-close" class="clickable" 
                            geometry="primitive: plane; width: 0.25; height: 0.12" 
                            material="transparent: true; opacity: 0" 
                            position="0 -0.5 0.12">
                            <a-plane width="0.25" height="0.12" color="#FFFFFF" position="0 0 0"></a-plane>
                            <a-text value="Zatvoriť" align="center" width="1.3" color="#0cdff2" position="0 0 0.02" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                        </a-entity>
                    </a-entity>
                </a-entity>
            </a-entity>

            <!-- ========== TARGET 2: KYBERNETICKÁ OBRANA ========== -->
            <a-entity mindar-image-target="targetIndex: 2">
                <a-plane width="1.1" height="1.6" color="#050505" opacity="0.95" position="0 0 -0.05"></a-plane>

                <a-entity id="network-nodes" position="0 0 0.1">
                    <a-sphere radius="0.25" src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/space/earth_atmos_2048.jpg"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 25000; easing: linear">
                    </a-sphere>
                    <a-sphere class="node" radius="0.02" color="#FF0000" position="0.4 0.2 0" animation="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 500"></a-sphere>
                    <a-sphere class="node" radius="0.02" color="#FF0000" position="-0.3 0.35 0.2" animation="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 700"></a-sphere>
                    <a-sphere class="node" radius="0.02" color="#FF0000" position="0.2 -0.4 -0.1" animation="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 600"></a-sphere>
                    <a-sphere class="node" radius="0.02" color="#FF0000" position="-0.4 -0.2 0.1" animation="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 800"></a-sphere>
                    <a-sphere class="node" radius="0.02" color="#FF0000" position="0.3 0.3 -0.3" animation="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 450"></a-sphere>
                    <a-sphere class="node" radius="0.02" color="#FF0000" position="-0.1 -0.5 0" animation="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 550"></a-sphere>
                    <a-sphere class="node" radius="0.02" color="#FF0000" position="0.45 -0.1 0.2" animation="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 650"></a-sphere>
                </a-entity>

                <a-sphere id="red-shield" radius="0.37" color="#FF0000" opacity="0.4" visible="true"
                        material="wireframe: true; wireframeLineWidth: 2" position="0 0 0.1">
                </a-sphere>
                <a-sphere id="blue-shield" radius="0.38" color="#00CCFF" opacity="0" visible="false"
                        material="wireframe: true; wireframeLineWidth: 2" position="0 0 0.1">
                </a-sphere>

                <a-entity position="-0.4 0.55 0.1">
                    <a-text id="log-1" value="> DETEKCIA ÚTOKOV..." color="#FF0000" width="1.5" position="0 0.1 0" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                    <a-text id="log-2" value="> IP: 192.168.1.104" color="#FF0000" width="1.2" position="0 0.02 0" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                    <a-text id="log-3" value="> TYP: DDOS_SPOOF" color="#FF3333" width="1.2" position="0 -0.06 0" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                </a-entity>

                <a-entity id="btn-firewall" class="clickable" 
                    position="0 -0.55 0.2" 
                    geometry="primitive: plane; width: 0.7; height: 0.2" 
                    material="transparent: true; opacity: 0">
                    <a-plane width="0.7" height="0.15" color="#FF3333" id="btn-bg"></a-plane>
                    <a-text id="btn-label" value="NASADIŤ FIREWALL" align="center" width="1.5" color="white" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                </a-entity>
            </a-entity>

            <!-- ========== TARGET 3: SOFTWARE A INTELIGENTNÉ SYSTÉMY ========== -->
            <a-entity mindar-image-target="targetIndex: 3">
                <a-plane width="1.1" height="1.6" color="#000000" opacity="0.85" position="0 0 -0.05"></a-plane>

                <a-text value="SOFTWARE A INTELIGENTNE \nSYSTEMY"
                        color="#66FFCC" align="center" width="1.5" position="0 0.65 0.1"
                        font="./Exo2-Medium-msdf.json" negate="false">
                </a-text>

                <!-- AI CORE (jedinečné ID, GLB model) -->
                <a-entity id="ai-core" position="0 0.15 0.12"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"
                    animation__pulse="property: scale; from: 1 1 1; to: 1.04 1.04 1.04; dir: alternate; loop: true; dur: 1800">
                    <a-gltf-model src="./cyber_brain_ai.glb" scale="0.12 0.12 0.12"></a-gltf-model>
                    <a-sphere radius="0.12" color="#00CCAA" opacity="0.18"></a-sphere>
                    <a-circle radius="0.09" color="#00E6C3" opacity="0.9"></a-circle>
                    <a-text value="AI" align="center" color="#FFFFFF" width="1.2" position="0 0 0.01"
                            font="./Exo2-Medium-msdf.json" negate="false">
                    </a-text>
                </a-entity>

                <!-- Spojnice -->
                <a-entity line="start: 0 0.15 0.1; end: -0.32 0.41 0.1; color: #33DDCC"></a-entity>
                <a-entity line="start: 0 0.15 0.1; end: 0.32 0.41 0.1; color: #66FF99"></a-entity>
                <a-entity line="start: 0 0.15 0.1; end: 0 -0.21 0.1; color: #33CCFF"></a-entity>

                <!-- Tlačidlo: PROGRAMOVANIE -->
                <a-entity id="btn-code" class="clickable" position="-0.32 0.41 0.12">
                    <a-circle radius="0.11" color="#c0c2c2" opacity="0.95"></a-circle>
                    <a-image src="./coding.png" width="0.10" height="0.10" position="0 0 0.01"></a-image>
                    <a-text value="PROGRAMOVANIE" align="center" width="0.9" position="0 -0.21 0.01"
                            font="./Exo2-Medium-msdf.json" negate="false">
                    </a-text>
                </a-entity>

                <!-- Tlačidlo: LINUX -->
                <a-entity id="btn-terminal" class="clickable" position="0.32 0.41 0.12">
                    <a-circle radius="0.11" color="#c0c2c2" opacity="0.95"></a-circle>
                    <a-image src="./linux.png" width="0.10" height="0.10" position="0 0 0.01"></a-image>
                    <a-text value="LINUX" align="center" color="#FFFFFF" width="0.9" position="0 -0.15 0.01"
                            font="./Exo2-Medium-msdf.json" negate="false">
                    </a-text>
                </a-entity>

                <!-- Tlačidlo: ANALÝZA -->
                <a-entity id="btn-ai" class="clickable" position="0 -0.15 0.12">
                    <a-circle radius="0.11" color="#c0c2c2" opacity="0.95"></a-circle>
                    <a-image src="./dashboard.png" width="0.10" height="0.10" position="0 0 0.01"></a-image>
                    <a-text value="ANALÝZA" align="center" color="#FFFFFF" width="1" position="0 -0.15 0.01"
                            font="./Exo2-Medium-msdf.json" negate="false">
                    </a-text>
                </a-entity>

                <!-- Info panel -->
                <a-plane id="sw-panel-bg" width="0.92" height="0.34" color="#0B1120" opacity="0.92" position="0 -0.58 0.1"></a-plane>
                <a-text id="sw-panel-title" value="SOFTWARE PANEL" align="center" color="#66FFCC" width="1"
                        position="0 -0.46 0.11" font="./Exo2-Medium-msdf.json" negate="false">
                </a-text>
                <a-text id="sw-panel-text"
                        value="Klikni na jednu z ikon pre zobrazenie ukážky kodu, terminalu alebo AI analyzy."
                        align="center" color="#FFFFFF" width="0.9" wrap-count="34"
                        position="0 -0.62 0.11" font="./Exo2-Medium-msdf.json" negate="false">
                </a-text>
            </a-entity>

        </a-scene>

        <!-- ========== HLAVNÝ SKRIPT ========== -->
        <script>
            // --- Premenné pre hradlá (mimo load, lebo sú globálne) ---
            let gateA = false;
            let gateB = false;
            let activeGate = 'AND';

            const gateImages = {
                AND: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/AND_ANSI.svg/200px-AND_ANSI.svg.png',
                OR:  'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/OR_ANSI.svg/200px-OR_ANSI.svg.png',
                NOT: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/NOT_ANSI.svg/200px-NOT_ANSI.svg.png'
            };

            window.addEventListener('load', () => {

                // ---- SELEKTORY ----
                const board        = document.querySelector('#main-board');
                const panel        = document.querySelector('#architecture-panel');
                const closeBtn     = document.querySelector('#btn-close');
                const hintText     = document.querySelector('#click-hint');
                const cpuModel     = document.querySelector('#cpu');

                const btnFirewall  = document.querySelector('#btn-firewall');
                const btnBg        = document.querySelector('#btn-bg');
                const btnLabel     = document.querySelector('#btn-label');
                const redShield    = document.querySelector('#red-shield');
                const blueShield   = document.querySelector('#blue-shield');
                const nodes        = document.querySelectorAll('.node');
                const log1         = document.querySelector('#log-1');
                const log2         = document.querySelector('#log-2');
                const log3         = document.querySelector('#log-3');

                const btnCode      = document.querySelector('#btn-code');
                const btnTerminal  = document.querySelector('#btn-terminal');
                const btnAi        = document.querySelector('#btn-ai');
                const panelTitle   = document.querySelector('#sw-panel-title');
                const panelText    = document.querySelector('#sw-panel-text');
                const aiCore       = document.querySelector('#ai-core');

                const btnA         = document.querySelector('#btnA');
                const btnB         = document.querySelector('#btnB');
                const outQ         = document.querySelector('#outQ');
                const txtQ         = document.querySelector('#txtQ');
                const gateDisplay  = document.querySelector('#gateDisplay');

                let isFirewallActive = false;

                // ---- POMOCNÁ FUNKCIA: pulz AI core ----
                function pulseAiCore() {
                    aiCore.removeAttribute('animation__pulse');
                    aiCore.setAttribute('animation__pulse',
                        'property: scale; from: 1 1 1; to: 1.08 1.08 1.08; dir: alternate; loop: 2; dur: 350'
                    );
                }

                // ---- TARGET 1: MOTHERBOARD PANEL ----
                if (board && panel && closeBtn) {
                    board.addEventListener('click', () => {
                        hintText && hintText.setAttribute('visible', 'false');
                        panel.setAttribute('visible', 'true');
                        board.setAttribute('visible', 'false');
                        cpuModel && cpuModel.setAttribute('visible', 'false');
                        panel.setAttribute('animation', 'property: position; from: 0 0 -0.1; to: 0 0 0.1; dur: 500; easing: easeOutExpo');
                    });

                    closeBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        hintText && hintText.setAttribute('visible', 'true');
                        board.setAttribute('visible', 'true');
                        cpuModel && cpuModel.setAttribute('visible', 'true');
                        panel.setAttribute('animation', 'property: position; from: 0 0 0.1; to: 0 0 -0.1; dur: 500; easing: easeOutExpo');
                        setTimeout(() => panel.setAttribute('visible', 'false'), 500);
                    });
                }

                // ---- TARGET 2: FIREWALL ----
                if (btnFirewall) {
                    btnFirewall.addEventListener('click', (e) => {
                        e.stopPropagation();

                        if (!isFirewallActive) {
                            redShield.setAttribute('visible', 'false');
                            blueShield.setAttribute('visible', 'true');
                            blueShield.setAttribute('animation', 'property: material.opacity; from: 0; to: 0.4; dur: 1000');
                            nodes.forEach(n => n.setAttribute('visible', 'false'));
                            log1 && log1.setAttribute('value', '> SYSTEM ZABEZPEČENÝ')  && log1.setAttribute('color', '#00CCFF');
                            log2 && log2.setAttribute('value', '> FIREWALL: AKTÍVNY')   && log2.setAttribute('color', '#00CCFF');
                            log3 && log3.setAttribute('value', '> NENÁJDENÉ ŽIADNE HROZBY') && log3.setAttribute('color', '#00CCFF');
                            // Oprava: setAttribute vracia element, nie null - použijeme priamo
                            if (log1) { log1.setAttribute('value', '> SYSTEM ZABEZPEČENÝ'); log1.setAttribute('color', '#00CCFF'); }
                            if (log2) { log2.setAttribute('value', '> FIREWALL: AKTÍVNY'); log2.setAttribute('color', '#00CCFF'); }
                            if (log3) { log3.setAttribute('value', '> NENÁJDENÉ ŽIADNE HROZBY'); log3.setAttribute('color', '#00CCFF'); }
                            btnBg.setAttribute('color', '#004466');
                            btnLabel.setAttribute('value', 'VYPNÚŤ FIREWALL');
                            isFirewallActive = true;
                        } else {
                            blueShield.setAttribute('visible', 'false');
                            redShield.setAttribute('visible', 'true');
                            nodes.forEach(n => n.setAttribute('visible', 'true'));
                            if (log1) { log1.setAttribute('value', '> DETEKCIA ÚTOKOV...'); log1.setAttribute('color', '#FF0000'); }
                            if (log2) { log2.setAttribute('value', '> IP: 192.168.1.104'); log2.setAttribute('color', '#FF0000'); }
                            if (log3) { log3.setAttribute('value', '> TYP: DDOS_SPOOF'); log3.setAttribute('color', '#FF3333'); }
                            btnBg.setAttribute('color', '#FF3333');
                            btnLabel.setAttribute('value', 'NASADIŤ FIREWALL');
                            isFirewallActive = false;
                        }
                    });
                }

                // ---- TARGET 3: SOFTWARE TLAČIDLÁ ----
                if (btnCode) {
                    btnCode.addEventListener('click', () => {
                        panelText.setAttribute('value',
                            'def evaluate_signal(signal):\n    if signal > 80:\n        return "ALERT"\n    else:\n        return "OK"'
                        );
                        pulseAiCore();
                    });
                }

                if (btnTerminal) {
                    btnTerminal.addEventListener('click', () => {
                        panelText.setAttribute('value',
                            '$ boot kernel\n$ start services\n$ network online\n$ system ready'
                        );
                        pulseAiCore();
                    });
                }

                if (btnAi) {
                    btnAi.addEventListener('click', () => {
                        panelText.setAttribute('value',
                            'ANALÝZA DÁT...\nHROZBA: 18%\nRIZIKO: NÍZKE\nODPORÚČANIE: POKRAČOVAŤ'
                        );
                        pulseAiCore();
                    });
                }

                // ---- TARGET 1: LOGIKA HRADIEL ----
                function updateLogic() {
                    let result = false;

                    if (activeGate === 'AND') {
                        result = gateA && gateB;
                        btnB.setAttribute('visible', 'true');
                    } else if (activeGate === 'OR') {
                        result = gateA || gateB;
                        btnB.setAttribute('visible', 'true');
                    } else if (activeGate === 'NOT') {
                        result = !gateA;
                        btnB.setAttribute('visible', 'false');
                    }

                    btnA.setAttribute('color', gateA   ? '#00FF00' : '#FF0000');
                    btnB.setAttribute('color', gateB   ? '#00FF00' : '#FF0000');
                    outQ.setAttribute('color', result  ? '#00FF00' : '#c0c2c2');
                    txtQ.setAttribute('value', result  ? '1' : '0');
                }

                // Prepínanie hradiel
                ['AND', 'OR', 'NOT'].forEach(gate => {
                    const btn = document.querySelector('#btnSelect' + gate);
                    if (btn) {
                        btn.addEventListener('click', () => {
                            activeGate = gate;
                            gateDisplay.setAttribute('src', gateImages[gate]);
                            ['AND', 'OR', 'NOT'].forEach(g => {
                                document.querySelector('#btnSelect' + g).setAttribute('color', '#333');
                            });
                            btn.setAttribute('color', '#00CCFF');
                            updateLogic();
                        });
                    }
                });

                if (btnA) btnA.addEventListener('click', () => { gateA = !gateA; updateLogic(); });
                if (btnB) btnB.addEventListener('click', () => { gateB = !gateB; updateLogic(); });

            }); // koniec load
