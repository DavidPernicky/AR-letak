<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta charset="UTF-8">
        <title>AR Vizitka - Katedra Informatiky</title>

        <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
                 color-space="sRGB" 
                 renderer="colorManagement: true, physicallyCorrectLights" 
                 vr-mode-ui="enabled: false" 
                 device-orientation-permission-ui="enabled: false">
            
            <a-assets>
                <!-- Obrázok hradla (ak ho nemáš, text postačí, ale s obrázkom je to profi) -->
                <img id="gate-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/AND_ANSI.svg/200px-AND_ANSI.svg.png">
            </a-assets>

            <!-- KAMERA: Pridaný raycaster a cursor pre klikanie na objekty s triedou 'clickable' -->
            <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

            <!-- TARGET 0: ÚVODNÁ STRANA -->
            <a-entity mindar-image-target="targetIndex: 0">
                <a-plane width="1.1" height="1.6" color="#000000" opacity="0.8" position="0 0 -0.09" material="transparent: true; side: double;"></a-plane>
                <a-entity position="0 0 0.1">
                    <a-image src="./logo-hud.png" width="0.7" height="0.7" position="0 0 0.1"></a-image>
                    <a-entity animation="property: rotation; to: 0 360 0; dir: alternate; loop: true; dur: 8000; easing: easeInOutSine">
                        <a-gltf-model src="./logokti.glb" scale="0.9 0.9 0.9" position="0 0 0"></a-gltf-model>
                    </a-entity>
                </a-entity>
                <a-text value="VITAJTE!" color="#FFFFFF" align="center" width="2" position="0 0.6 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="KATEDRA INFORMATIKY" color="#92d404" align="center" width="2" position="0 0.49 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="OTVORTA LETÁK A VNÚTRI OBJAVÍTE:" color="#FFFFFF" align="center" width="1" position="0 -0.38 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="- Taktický Hardware" color="#1e1ee6" align="center" width="1" position="0 -0.53 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="- Software a AI na bojisku" color="#11d66a" align="center" width="1" position="0 -0.49 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
                <a-text value="- Kybernetickú Obranu AOS" color="#d64911" align="center" width="1" position="0 -0.45 0.1" font="./Exo2-Medium-msdf.json" negate="false"></a-text>
            </a-entity>

            <!-- TARGET 1: HARDVÉROVÁ STRANA -->
<a-entity mindar-image-target="targetIndex: 1">
    <a-plane width="1.1" height="1.6" color="#050505" opacity="0.8" position="0 0 -0.05"></a-plane>
    

    
    <!-- MENU PRE VÝBER HRADLA -->
    <a-entity position="-0.33 0.85 0.1">
        <a-text value="VYBER HRADLO:" position="0 -0.15 0" align="center" width="1" color="#FFF"></a-text> 
        <a-circle id="btnSelectAND" class="clickable" radius="0.04" color="#00CCFF" position="-0.1 -0.3 0">
            <a-text value="AND" align="center" width="0.8" position="0 0 0.01"></a-text>
        </a-circle>
        <a-circle id="btnSelectOR" class="clickable" radius="0.04" color="#333" position="0 -0.3 0">
            <a-text value="OR" align="center" width="0.8" position="0 0 0.01"></a-text>
        </a-circle>
        <a-circle id="btnSelectNOT" class="clickable" radius="0.04" color="#333" position="0.1 -0.3 0">
            <a-text value="NOT" align="center" width="0.8" position="0 0 0.01"></a-text>
        </a-circle>
    </a-entity>

    <!-- INTERAKTÍVNA LOGIKA -->
    <a-entity position="-0.3 0.4 0.1">
        <a-image id="gateDisplay" src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/AND_ANSI.svg/200px-AND_ANSI.svg.png" width="0.2" height="0.12" position="0 0 0"></a-image>
        
        <!-- Vstupy -->
        <a-sphere id="btnA" class="clickable" radius="0.03" color="#FF0000" position="-0.12 0.04 0">
            <a-text value="A" position="0 0.06 0" align="center" width="2"></a-text>
        </a-sphere>
        <a-sphere id="btnB" class="clickable" radius="0.03" color="#FF0000" position="-0.12 -0.04 0">
            <a-text value="B" position="0 -0.06 0" align="center" width="2"></a-text>
        </a-sphere>

        <!-- Výstup -->
        <a-sphere id="outQ" radius="0.04" color="#222222" position="0.15 0 0">
            <a-text id="txtQ" value="0" position="0 -0.08 0" align="center" width="2"></a-text>
        </a-sphere>
    </a-entity>

    <!-- OSTATNÉ PRVKY (CPU a DRON) ostanú ako predtým -->
    <a-entity position="0 0 0.2">
        <a-gltf-model src="./cpu-model.glb" scale="0.0015 0.0015 0.0015" animation="property: rotation; to: 0 360 360; loop: true; dur: 8000; easing: easeInOutSine"></a-gltf-model>
    </a-entity>

    <a-entity position="0.35 -0.5 0.1">
        <a-gltf-model src="./drone.glb" scale="0.3 0.3 0.3" animation="property: position; from: 0 0 0; to: 0 0.08 0; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true"></a-gltf-model>
    </a-entity>

    
   <!-- 3. ARCHITEKTÚRY PC SYSTÉMOV (Vpravo hore) -->
    <a-entity position="0.35 0.5 0.1">
        
        <!-- Hlavná doska - jediná má triedu 'clickable' na začiatku -->
        <a-entity id="main-board" class="clickable" gltf-model="./motherboard.glb" 
                  scale="1 1 1" rotation="-90 0 0" position="0 0 0">
        </a-entity>

        <a-text id="click-hint" value="KLIKNI NA DOSKU" align="center" position="0 0.3 0" width="1.2" color="#92d404"></a-text>

        <!-- PANEL S KOMPONENTMI (Štartuje ako visible: false) -->
        <a-entity id="architecture-panel" visible="false">
            
            <!-- Čierne pozadie panelu, aby komponenty nesplývali s letákom -->
            <a-plane width="0.6" height="1.2" color="#111" position="0 0 0.05" opacity="1"></a-plane>
             <a-text id="textP" value="Hlavne komponenty dosky:" align="center" position="0 0.5 0.1" width="1.2" color="#92d404"></a-text>

            <!-- CPU -->
            <a-entity id="p-cpu" gltf-model="./pc_cpu_processor.glb" scale="0.06 0.06 0.06" position="0 0.3 0.1" rotation="-90 0 0"></a-entity>
            <a-text value="PROCESOR" position="0 0.2 0.1" width="1" align="center"></a-text>

            <!-- RAM -->
            <a-entity id="p-ram" gltf-model="./old_computer_ram.glb" scale="0.07 0.07 0.07" position="0 0 0.1" rotation="-90 0 0"></a-entity>
            <a-text value="PAMAT RAM" position="0 -0.2 0.12" width="1" align="center"></a-text>

            <!-- GPU -->
            <a-entity id="p-gpu" gltf-model="./gpu.glb" scale="0.04 0.04 0.04" position="0 -0.4 0.1" rotation="-90 0 0"></a-entity>
            <a-text value="GRAFIKA" position="0 -0.5 0.1" width="1" align="center"></a-text>

            <!-- Tlačidlo na zavretie -->
            <a-rect width="0.2" height="0.1" fill="none" stroke="white" stroke-width="2" position="0 0 0.01"></a-rect>
            
            <a-text value="ZAVRIET" align="center" width="2.2" color="white" position="0 0 0.02" font="./Exo2-Medium-msdf.json" negate="false"></a-text>

        </a-entity>
    </a-entity>
</a-entity>

<!-- TENTO SKRIPT DÁVAJ AŽ ÚPLNE NA KONIEC BODY, PRED </body> -->
<script>
    // Počkáme, kým sa celá scéna načíta
    window.addEventListener('load', () => {
        const board = document.querySelector('#main-board');
        const panel = document.querySelector('#architecture-panel');
        const closeBtn = document.querySelector('#btn-close');
        const hintText = document.querySelector('#click-hint');

        if(board && panel && closeBtn) {
            // OTVORENIE
            board.addEventListener('click', () => {
                hintText.setAttribute('visible', 'false'); // Skryť nápis "Klikni pre info"
                panel.setAttribute('visible', 'true');    // Ukázať panel
    
                // NOVINKA: Skryjeme maticnú dosku, aby nezavadzala
                board.setAttribute('visible', 'false'); 

                panel.setAttribute('animation', 'property: position; from: 0 0 -0.1; to: 0 0 0.1; dur: 500; easing: easeOutExpo'); 
            });

            // ZAVRETIE
            closeBtn.addEventListener('click', () => {
                hintText.setAttribute('visible', 'true'); // Znova ukázať nápis
    
                // NOVINKA: Znova ukážeme maticnú dosku
                board.setAttribute('visible', 'true');

                panel.setAttribute('animation', 'property: position; from: 0 0 0.1; to: 0 0 -0.1; dur: 500; easing: easeOutExpo');
                
                setTimeout(() => {
                    panel.setAttribute('visible', 'false');
                }, 500);
                        });
                    } else {
                        console.error("Nepodarilo sa nájsť prvky v DOM!");
                    }
                });
</script>


</a-entity>

<!-- JAVASCRIPT PRE DYNAMICKÚ LOGIKU -->
    <script>
    // Počkáme, kým sa celá scéna načíta
    window.addEventListener('load', () => {
        const board = document.querySelector('#main-board');
        const panel = document.querySelector('#architecture-panel');
        const closeBtn = document.querySelector('#btn-close');
        const hint = document.querySelector('#click-hint');

        if(board && panel && closeBtn) {
            // OTVORENIE
            board.addEventListener('click', () => {
                console.log("Doska kliknutá");
                panel.setAttribute('visible', 'true');
                hint.setAttribute('visible', 'false');
                board.setAttribute('class', 'not-clickable'); // Aby sme neklikali cez panel
            });

            // ZAVRETIE
            closeBtn.addEventListener('click', () => {
                console.log("Zavrieť kliknuté");
                panel.setAttribute('visible', 'false');
                hint.setAttribute('visible', 'true');
                board.setAttribute('class', 'clickable');
            });
        } else {
            console.error("Nepodarilo sa nájsť prvky v DOM!");
        }
    });
</script>

    <script>
        let a = false;
        let b = false;
        let activeGate = 'AND'; // Predvolené hradlo

        const gateImages = {
            AND: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/AND_ANSI.svg/200px-AND_ANSI.svg.png',
            OR: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/OR_ANSI.svg/200px-OR_ANSI.svg.png',
            NOT: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/NOT_ANSI.svg/200px-NOT_ANSI.svg.png'
        };

        function updateLogic() {
            let result = false;
            const btnB = document.querySelector('#btnB');

            if (activeGate === 'AND') {
                result = a && b;
                btnB.setAttribute('visible', 'true');
            } else if (activeGate === 'OR') {
                result = a || b;
                btnB.setAttribute('visible', 'true');
            } else if (activeGate === 'NOT') {
                result = !a; // NOT berie len vstup A
                btnB.setAttribute('visible', 'false'); // Skryjeme nepotrebný vstup B
            }

            document.querySelector('#btnA').setAttribute('color', a ? '#00FF00' : '#FF0000');
            document.querySelector('#btnB').setAttribute('color', b ? '#00FF00' : '#FF0000');
            document.querySelector('#outQ').setAttribute('color', result ? '#00FF00' : '#222222');
            document.querySelector('#txtQ').setAttribute('value', result ? '1' : '0');
        }

        // Prepínanie typu hradla
        ['AND', 'OR', 'NOT'].forEach(gate => {
            document.querySelector('#btnSelect' + gate).addEventListener('click', () => {
                activeGate = gate;
                document.querySelector('#gateDisplay').setAttribute('src', gateImages[gate]);
                
                // Reset farieb tlačidiel menu
                ['AND', 'OR', 'NOT'].forEach(g => document.querySelector('#btnSelect' + g).setAttribute('color', '#333'));
                document.querySelector('#btnSelect' + gate).setAttribute('color', '#00CCFF');
                
                updateLogic();
            });
        });

        document.querySelector('#btnA').addEventListener('click', () => { a = !a; updateLogic(); });
        document.querySelector('#btnB').addEventListener('click', () => { b = !b; updateLogic(); });
    </script>
    </body>
</html>
